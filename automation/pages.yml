# Optional: copy to .github/workflows/pages.yml AFTER choosing GitHub Actions
# as the Pages publishing source. Do not use this alongside branch deployment.
name: Build and deploy personal website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build static pages
        run: python3 tools/build.py
      - name: Check local links and metadata
        run: python3 tools/check_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
